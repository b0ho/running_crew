spring:
  application:
    name: learnkk-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learnkk}
    username: ${DB_USERNAME:learnkk}
    password: ${DB_PASSWORD:learnkk}
    hikari:
      # performance-design.md §3 — 소규모 파일럿 풀 사이징
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # R-U1-23 — 파일당 최대 10MB
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    session:
      # 기본 30분 idle (security-design.md §1)
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

# 애플리케이션 커스텀 설정
security:
  bcrypt:
    # R-U1-05 / NFR-SEC-1 — 기본 10, 하한 8 (SecurityConfig 에서 검증)
    cost: ${BCRYPT_COST:10}

app:
  admin:
    # R-U1-26/27 — 시드 관리자 계정(환경변수 주입, 미설정 시 부팅 중단)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    # FE 오리진 (allowCredentials 와 함께 사용)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # R-U1-21 — 웹루트 밖 업로드 볼륨
    upload-dir: ${UPLOAD_DIR:./var/uploads}

# springdoc-openapi (permitAll — SecurityConfig)
springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
